version: '3.8'

services:
  api:
    depends_on:
      - db
    build:  
      context: docker/api
      dockerfile: ./Dockerfile
    user: "node"
    tty: true
    volumes:
      - ./:/app
    ports:
      - ${PORT}:3000
      - ${DEBUG_PORT}:9229
    command: >
      bash -c "npm ci
      && rm -rf dist
      && npm run start:debug"

  db:
    build:
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
      - ./docker/postgres/init-scripts:/docker-entrypoint-initdb.d
  
  vector_db:
    image: qdrant/qdrant
    ports:
      - ${VECTOR_DB_PORT}:6333
    volumes:
      - ./docker/qdrant/data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__RELOAD_CONFIG=true #only for development 
      - QDRANT__SERVICE__RELOAD_CONFIG_INTERVAL=1 #only for development 
    

  db_tests:
    build:
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: username_test
      POSTGRES_PASSWORD: secret_test
      POSTGRES_DB: aiguide_test
    ports:
      - 54321:5432
    volumes:
      - ./docker/postgres/data_tests:/var/lib/postgresql/data
      - ./docker/postgres/init-scripts:/docker-entrypoint-initdb.d

  redis:
    restart: unless-stopped
    image: redis:alpine
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - ./docker/redis/data:/data